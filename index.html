<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Apple — Think different." />
    <title>Apple</title>

    <!-- Styles -->
    <link rel="stylesheet" href="styles/reset.css" />
    <link rel="stylesheet" href="styles/main.css" />
    <link rel="stylesheet" href="styles/animations.css" />

    <!-- Component styles (added by later beads) -->
    <!-- <link rel="stylesheet" href="styles/nav.css" /> -->
    <!-- <link rel="stylesheet" href="styles/hero.css" /> -->
    <!-- <link rel="stylesheet" href="styles/products.css" /> -->
    <!-- <link rel="stylesheet" href="styles/features.css" /> -->
    <!-- <link rel="stylesheet" href="styles/footer.css" /> -->
  </head>

  <body>
    <!-- =============================================
         Navigation
         ============================================= -->
    <header id="site-header" role="banner">
      <nav id="main-nav" aria-label="Main navigation">
        <!-- Populated by nav component (nav.html / js/nav.js) -->
      </nav>
    </header>

    <!-- =============================================
         Main content
         ============================================= -->
    <main id="main-content">

      <!-- Hero Section -->
      <section id="hero" aria-labelledby="hero-headline">
        <!-- Populated by hero component -->
      </section>

      <!-- Product Showcase -->
      <section id="products" aria-label="Product showcase">
        <!-- Populated by products component -->
      </section>

      <!-- Features / Chip Section -->
      <section id="features" aria-label="Features highlight">
        <!-- Populated by features component -->
      </section>

      <!-- Privacy Section -->
      <section id="privacy" aria-label="Privacy">
        <!-- Populated by features component -->
      </section>

    </main>

    <!-- =============================================
         Footer
         ============================================= -->
    <footer id="site-footer" role="contentinfo">
      <!-- Populated by footer component -->
    </footer>

    <!-- Scripts -->
    <script type="module" src="js/main.js"></script>
  </body>
</html>
